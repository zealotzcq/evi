name: Release Build

on:
  push:
    branches:
      - 'V*_release'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $ver = $branch -replace '^V', '' -replace '_release$', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
      - name: Set version in Cargo.toml
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"${env:VERSION}`"" | Set-Content Cargo.toml
      - name: Build
        run: cargo build --release
      - name: Package ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $pkgName = "evi-${env:VERSION}-windows-x86_64"
          mkdir staging
          Copy-Item target\release\vi.exe staging\
          Copy-Item evi.ico staging\
          Copy-Item config.json staging\
          Copy-Item system_prompt.txt staging\
          Copy-Item prefill_template.txt staging\
          Compress-Archive -Path staging\* -DestinationPath "${pkgName}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evi-${{ steps.version.outputs.VERSION }}-windows-x86_64
          path: evi-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip

  build-mac-x86:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          VER="${BRANCH#V}"
          VER="${VER%_release}"
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"
      - name: Add x86_64 target
        run: rustup target add x86_64-apple-darwin
      - name: Build
        run: cargo build --release --features "mac" --target x86_64-apple-darwin
      - name: Package DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x package_macos.sh && bash package_macos.sh "${VERSION}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evi-${{ steps.version.outputs.VERSION }}-macos-x86_64
          path: dist/evi-${{ steps.version.outputs.VERSION }}-macos-x86_64.dmg

  build-mac-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          VER="${BRANCH#V}"
          VER="${VER%_release}"
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"
      - name: Download ONNX Runtime
        run: |
          mkdir -p ort-dylib
          curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-osx-arm64-1.24.2.tgz" | tar xz -C ort-dylib
      - name: Build
        run: cargo build --release --features "mac" --target aarch64-apple-darwin
      - name: Package DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x package_macos_app.sh && bash package_macos_app.sh "${VERSION}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evi-${{ steps.version.outputs.VERSION }}-macos-aarch64
          path: dist/evi-${{ steps.version.outputs.VERSION }}-macos-aarch64.dmg
